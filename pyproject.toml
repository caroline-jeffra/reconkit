[project]
name = "reconkit"
version = "0.1.0"
description = "A small toolkit of web-recon commands relating to monitoring and management of WordPress sites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
]

[project.scripts]
reconkit = "reconkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconkit"]
