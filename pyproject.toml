[project]
name = "reconkit"
version = "0.1.0"
description = "A small toolkit of web-recon commands for auditing sites you own"
readme = "README.md"
authors = [{ name = "C. Jeffra" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
keywords = [
    "reconnaissance",
    "wordpress",
    "cloudflare",
    "dns",
    "http",
    "cli",
]
dependencies = [
    "requests>=2.31",
    "typer>=0.13",
]

[project.urls]
Homepage = "https://github.com/caroline-jeffra/reconkit"
Repository = "https://github.com/caroline-jeffra/reconkit"
Issues = "https://github.com/caroline-jeffra/reconkit/issues"

[project.scripts]
reconkit = "reconkit.cli:app"

[project.optional-dependencies]
gcp = [
    "google-cloud-logging>=3.16.3",
    "google-cloud-monitoring>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/reconkit"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconkit"]
