[project]
name = "reconkit"
version = "0.1.0"
description = "A small toolkit of web-recon commands relating to monitoring and management of WordPress sites"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
]

[project.scripts]
reconkit = "reconkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # Typer resolves annotations at runtime, and `str | None` raises
    # "RuntimeError: Type not yet supported" on Python 3.10 — our declared
    # floor. The Optional[...] form in cli.py must stay.
    "UP045",
    "UP007",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconkit"]
